name: Publish package to the Maven Central Repository
on:
  #push:
  #    branches: [ v1.2-DEV ]
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Maven Central Repository
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: 'central'
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Write release version
        run: |
          TAG=${{ github.ref_name }}
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV
          echo "VERSION=$VERSION"
      - name: Install gpg key and publish package
        run: |
          echo -e "Releasing ${VERSION}"
          echo -e "$(tty)"
          gpg --version
          mvn -version
          # This avoids gpg: signing failed: Inappropriate ioctl for device error
          # See https://github.com/keybase/keybase-issues/issues/2798
          export GPG_TTY=$(tty)
          # export GPG_TTY=`tty`
          # https://gist.github.com/sualeh/ae78dc16123899d7942bc38baba5203c
          echo -e "${{ secrets.OSSRH_GPG_SECRET_KEY }}" | gpg --batch --import 
          gpg --list-secret-keys --keyid-format LONG
          mvn --batch-mode clean deploy  -Drevision=${VERSION} -Dgpg.passphrase=${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}  -DperformRelease=true
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}