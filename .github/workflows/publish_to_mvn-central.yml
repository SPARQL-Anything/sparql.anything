name: Publish package to the Maven Central Repository
on:
  push:
    branches: [ v1.1-DEV ]
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Maven Central Repository
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: test
        run: |
            echo -e "${{secrets.OSSRH_GPG_SECRET_KEY}}"
            echo -e "${{secrets.OSSRH_GPG_SECRET_KEY_PASSWORD}}"
            echo -e "${{secrets.OSSRH_TOKEN}}"
            echo -e "${{secrets.OSSRH_USERNAME}}"
      
